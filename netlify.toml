[build]
  publish = "web"
  # crea web/shared/js/config.js dalle variabili d'ambiente SUPABASE_URL e SUPABASE_KEY del sito
  command = "node scripts/genera-config.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# la configurazione cambia a ogni deploy: niente cache lunga
[[headers]]
  for = "/shared/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
